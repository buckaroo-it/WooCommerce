name: Build, Upload Release, and Sync with SVN

on:
    # A full release is published, or a pre-release is changed to a full
    # release. Pre-releases themselves are not published to wordpress.org.
    release:
        types:
            - released
    # Builds the package without publishing, so packaging changes are checked
    # before a release.
    pull_request:
        paths:
            - .distignore
            - composer.json
            - composer.lock
            - tools/mozart/**
            - .github/workflows/main.yml

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    package:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.get_version.outputs.version }}

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: '8.2'
                    tools: composer:v2
                    coverage: none

            -   name: Install prod deps & compile
                run: |
                    composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
                    composer compose-dependencies
                    composer dump-autoload -o

            -   name: Get Release Version
                id: get_version
                env:
                    EVENT_NAME: ${{ github.event_name }}
                    GIT_TAG: ${{ github.event.release.tag_name }}
                run: |
                    RELEASE_VERSION=$(grep "^Stable tag:" readme.txt | awk -F' ' '{print $NF}' | tr -d '\r')
                    PLUGIN_VERSION=$(grep "^Version:" index.php | awk -F' ' '{print $NF}' | tr -d '\r')
                    echo "Release Version: $RELEASE_VERSION"

                    if [ -z "$RELEASE_VERSION" ]; then
                        echo "Error: readme.txt has no 'Stable tag:' line."
                        exit 1
                    fi

                    if [ "$RELEASE_VERSION" != "$PLUGIN_VERSION" ]; then
                        echo "Error: Stable tag ($RELEASE_VERSION) in readme.txt does not match Version ($PLUGIN_VERSION) in index.php."
                        exit 1
                    fi

                    if [ "$EVENT_NAME" = "release" ] && [ "${GIT_TAG#v}" != "$RELEASE_VERSION" ]; then
                        echo "Error: release tag ($GIT_TAG) does not match Stable tag ($RELEASE_VERSION) in readme.txt."
                        exit 1
                    fi

                    echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

            -   name: Record the bundled SDK version
                run: |
                    SDK_VERSION=$(composer show --locked buckaroo/sdk --format=json | jq -r '.versions[0]')
                    echo "Bundled Buckaroo PHP SDK: $SDK_VERSION"
                    echo "Bundled Buckaroo PHP SDK: \`$SDK_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

            -   name: Stage package
                run: |
                    PACKAGE_DIR="$RUNNER_TEMP/package"
                    mkdir -p "$PACKAGE_DIR"
                    rsync -a --exclude-from=.distignore ./ "$PACKAGE_DIR/wc-buckaroo-bpe-gateway/"
                    rsync -a ./.wordpress-org/ "$PACKAGE_DIR/wordpress-org/"

            -   name: Check package contents
                working-directory: ${{ runner.temp }}/package/wc-buckaroo-bpe-gateway
                run: |
                    failed=0
                    for path in index.php readme.txt src templates library library/.htaccess languages \
                        assets/js/dist assets/apple-developer-merchantid-domain-association vendor vendor_buckaroo; do
                        if [ ! -e "$path" ]; then
                            echo "::error::$path is missing from the package"
                            failed=1
                        fi
                    done
                    for path in tests bin tools composer.json composer.lock phpunit.xml.dist phpcs.xml \
                        assets/js/package.json assets/js/webpack.config.js; do
                        if [ -e "$path" ]; then
                            echo "::error::$path must not be in the package"
                            failed=1
                        fi
                    done
                    dotfiles=$(find . -maxdepth 1 -name '.*' ! -name '.')
                    if [ -n "$dotfiles" ]; then
                        echo "::error::Dotfiles must not be in the package: $dotfiles"
                        failed=1
                    fi
                    exit "$failed"

            -   name: Upload package
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: wc-buckaroo-bpe-gateway
                    path: ${{ runner.temp }}/package
                    include-hidden-files: true # library/.htaccess
                    if-no-files-found: error

    svn:
        needs: package
        if: github.event_name == 'release'
        runs-on: ubuntu-latest
        # Configured in the repository settings: required reviewers, v* tags
        # only, and the SVN credentials as environment secrets.
        environment: wordpress-org

        steps:
            -   name: Download package
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: wc-buckaroo-bpe-gateway
                    path: ${{ runner.temp }}/package

            -   name: Install Subversion
                run: sudo apt-get update --allow-releaseinfo-change && sudo apt-get install -y subversion

            -   name: Sync with SVN on Release
                env:
                    SVN_USERNAME: ${{ secrets.SVN_REP_USER }}
                    SVN_PASSWORD: ${{ secrets.SVN_REP_PW }}
                    RELEASE_VERSION: ${{ needs.package.outputs.version }}
                run: |
                    set -euo pipefail

                    if [ -z "$RELEASE_VERSION" ]; then
                        echo "Error: RELEASE_VERSION is empty."
                        exit 1
                    fi
                    echo "version: $RELEASE_VERSION"

                    PACKAGE_DIR="$RUNNER_TEMP/package"
                    SVN_URL="https://plugins.svn.wordpress.org/wc-buckaroo-bpe-gateway"

                    # Released tags are never overwritten.
                    if svn ls --non-interactive "$SVN_URL/tags/$RELEASE_VERSION" > /dev/null 2>&1; then
                        echo "Error: SVN tag $RELEASE_VERSION already exists."
                        exit 1
                    fi

                    WORKDIR="$HOME/tmp"
                    mkdir -p "$WORKDIR"
                    cd "$WORKDIR"

                    # Reading needs no credentials. Shallow checkout root, then
                    # fully fetch trunk and assets.
                    svn checkout --non-interactive --depth immediates "$SVN_URL" wc-buckaroo-bpe-gateway
                    cd wc-buckaroo-bpe-gateway
                    svn update --non-interactive trunk --set-depth infinity || true
                    if [ -d assets ]; then
                        svn update --non-interactive assets --set-depth infinity || true
                    else
                        mkdir -p assets
                        svn add assets || true
                    fi

                    rsync -a --delete -c "$PACKAGE_DIR/wc-buckaroo-bpe-gateway/" trunk/
                    rsync -a --delete -c "$PACKAGE_DIR/wordpress-org/" assets/

                    svn add --force trunk assets 2>/dev/null || true
                    svn status --ignore-externals | grep -E "^\!" | sed -E 's/^\![[:space:]]+//' | while IFS= read -r f; do
                        svn rm --force "$f"
                    done || true

                    # Trunk and the tag are committed together, so the Stable tag
                    # in trunk always points to an existing tag.
                    svn copy trunk "tags/$RELEASE_VERSION"

                    # The password is read from stdin, so it never appears in
                    # the process list.
                    printf '%s' "$SVN_PASSWORD" | svn commit \
                        --config-option servers:global:http-timeout=3600 \
                        --username "$SVN_USERNAME" --password-from-stdin --no-auth-cache \
                        --non-interactive \
                        -m "release $RELEASE_VERSION"

                    echo "SVN sync completed successfully for version: $RELEASE_VERSION"

    github-release:
        needs: package
        if: github.event_name == 'release'
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   name: Download package
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: wc-buckaroo-bpe-gateway
                    path: ${{ runner.temp }}/package

            -   name: Upload Asset to Release
                env:
                    GH_TOKEN: ${{ github.token }}
                    GIT_TAG: ${{ github.event.release.tag_name }}
                run: |
                    cd "$RUNNER_TEMP/package"
                    zip -r -q "$RUNNER_TEMP/wc-buckaroo-bpe-gateway.zip" wc-buckaroo-bpe-gateway
                    gh release upload "$GIT_TAG" "$RUNNER_TEMP/wc-buckaroo-bpe-gateway.zip" --repo "$GITHUB_REPOSITORY" --clobber

name: Code Quality Checks

on: [ push ]

permissions:
    contents: read

jobs:
    phpcs:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: [ '7.4' ]
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none

            -   name: Cache composer
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        vendor
                        ~/.composer/cache
                    key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                    restore-keys: ${{ runner.os }}-composer-

            -   name: Install dependencies
                run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

            -   name: Run PHPCS via Composer script
                run: composer phpcs

    prettier:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Set up Node
                uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
                with:
                    node-version-file: .nvmrc
                    cache: 'npm'
                    cache-dependency-path: assets/js/package-lock.json
            -   name: Install JS deps
                working-directory: assets/js
                run: npm ci

            -   name: Prettier blocks
                working-directory: assets/js
                run: npx prettier --check . --config ./.prettierrc.js

            -   name: Prettier legacy
                working-directory: library
                run: npx prettier --check . --config ../assets/js/.prettierrc.js

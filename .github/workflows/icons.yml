name: Icon update
on:
    workflow_dispatch:
        inputs:
            media_commit:
                description: Full commit SHA of buckaroo-it/Media to import
                required: true
                type: string

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            -   name: Check the Media commit
                env:
                    MEDIA_COMMIT: ${{ inputs.media_commit }}
                run: |
                    if ! [[ "$MEDIA_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                        echo "::error::media_commit must be a full 40-character commit SHA."
                        exit 1
                    fi
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Clone media repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    repository: buckaroo-it/Media
                    ref: ${{ inputs.media_commit }}
                    path: Media
                    persist-credentials: false
            -   name: Rename all files to lowercase
                run: |
                    cd Media
                    cp ${{ github.workspace }}/.github/workflows/rename-icons.php ${{ github.workspace }}/Media/rename-icons.php
                    php  ./rename-icons.php
            -   name: Copy payment method icons
                run: |
                    cd Media
                    cp -R "Payment methods/SVG/." ${{ github.workspace }}/library/buckaroo_images/svg/
                    cd ${{ github.workspace }}/library/buckaroo_images/svg/
                    rm -f vouchers.svg tinka.svg buckaroovoucher.svg
                    rm -f ideal-qr.svg paylink.svg pos.svg pos-nfc.svg riverty.svg
            -   name: Copy creditcards icons
                run: |
                    cd Media
                    cp -R "Creditcard issuers/SVG/." ${{ github.workspace }}/library/buckaroo_images/creditcards/
                    cd ${{ github.workspace }}/library/buckaroo_images/creditcards/
                    rm -f mastercard_debit.svg
            -   name: Copy payment issuers icons
                run: |
                    cd Media
                    cp -R "iDEAL bank issuers/SVG/." ${{ github.workspace }}/library/buckaroo_images/ideal/
            -   name: Cleanup
                run: |
                    rm -rd Media
            -   name: Check the icons
                run: |
                    php .github/workflows/check-icons.php \
                        library/buckaroo_images/svg library/buckaroo_images/creditcards library/buckaroo_images/ideal
            -   name: Open a pull request
                env:
                    GH_TOKEN: ${{ github.token }}
                    MEDIA_COMMIT: ${{ inputs.media_commit }}
                    BASE_BRANCH: ${{ github.ref_name }}
                run: |
                    if [ -z "$(git status --porcelain library/buckaroo_images)" ]; then
                        echo "No icon changes."
                        exit 0
                    fi
                    SHORT="${MEDIA_COMMIT:0:7}"
                    BRANCH="icons/media-$SHORT"
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git switch -c "$BRANCH"
                    git add library/buckaroo_images
                    git commit -m "Apply logo changes from buckaroo-it/Media@$SHORT"
                    git push origin "$BRANCH"
                    gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
                        --title "Apply logo changes from buckaroo-it/Media@$SHORT" \
                        --body "Icons from https://github.com/buckaroo-it/Media/commit/$MEDIA_COMMIT, opened by the Icon update workflow. GitHub does not run checks on pull requests opened by a workflow: close and reopen this PR to start them."

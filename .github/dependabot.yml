version: 2
updates:
    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: monthly
        cooldown:
            default-days: 7
        groups:
            actions:
                patterns: [ '*' ]

    -   package-ecosystem: composer
        directories: [ '/', '/tools/mozart' ]
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
